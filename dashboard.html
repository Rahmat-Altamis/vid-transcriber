<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width", initial-scale="1.0" />
<title> VID CAPT, dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root{
        --black:#12151b;
        --more-black:#1b1f28;
        --waito:#e9e4d6;
        --little-white:#f3efe4;
        --gem: #e8a33d;
        --choco:#8a6425;
        --chinese-flag:#b5442e;
        --moss:#4c7a5b;
        --slate:#8b93a0;
        --slate-dim:#565d69;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
        background:var(--black);
        color:var(--waito);
        font-family:'Public Sans',system-ui,sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing:antialiased;
    }
    ::selection{background: var(--gem);color:var(--black);}
    :focus-visible{outline: 2px solid var(--gem); outline-offset: 1px;}

    .masthead{
        border-bottom: 2px solid var(--gem);
        padding: 22px 28px 16px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
    }
    .masthead h1{
        font-family:'Barlow Condensed',sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: clamp(32px,5vw,52px);
        margin: 0;
        line-height: 0.9;
    }
    .masthead .sub{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--slate);
        text-transform: uppercase;
        margin-top: 6px;
    }
    .control-strip{
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 14px 28px;
        background: var(--more-black);
        border-bottom: 1px solid #2a2f3a;
    }
    .control-strip.quick{ background: #1f2a1f; border-bottom: 1px solid #35452f;}
    .control-strip label{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 11px;
        color: var(--slate);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .api-field{
        background: var(--black);
        border: 1px solid #333a48;
        color: var(--waito);
        font-family: 'IBM Plex Mono',monospace;
        font-size: 12px;
        padding:7px 10px;
        border-radius: 3px;
        min-width: 220px;
    }
    .api-field.wide{ flex:1; min-width: 180px; }
    .dispatch-btn{
        font-family: 'Barlow Condensed',sans-serif;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 15px;
        background: var(--gem);
        color: var(--black);
        border: none;
        padding: 10px 20px;
        border-radius: 3px;
        cursor: pointer;
        transition: transform 0.08s ease, background 0.15 ease;
        white-space: nowrap;
    }
    .dispatch-btn:hover:not(:disabled){background: #f0b357;}
    .dispatch-btn:active:not(:disabled){transform: translateY(1px);}
    .dispatch-btn:disabled{background: #4a4a45;color:#8a8a80;cursor:not-allowed;}
    .dispatch-btn.quick{background:#7fb08a;}
    .dispatch-btn.quick:hover:not(:disabled){background: #93c19e;}
    
    .status-readout{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 12px;
        color: var(--slate);
        margin-left: auto;
    }
    .status-readout b{color: var(--waito);}
    
    .conn-error, .quick-error{
        padding: 10px 28px;
        background: #2a1512;
        color: #e8b9ad;
        font-family: 'IBM Plex Mono',monospace;
        font-size: 12px;
        border-bottom: 1px solid var(--chinese-flag);
    }
    main{
        padding: 22px 28px 60px;
        max-width: 1180px;
        margin: auto;
    }
    .section-title{
        font-family: 'Barlow Condensed',sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 20px;
        color: #e8a33d;
        margin: 26px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #2a2f3a;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
    }
    .section-title span{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 10.5px;
        letter-spacing: 0.02em;
        text-transform: none;
        color: #8b93a0;
        font-weight: 400;
    }
    .empty{
        padding: 34px 20px;
        text-align: center;
        color: #8b93a0;
        border: 1px dashed #2a2f3a;
        border-radius: 4px;
    }
    .empty.small{ padding: 20px; font-family: 'IBM Plex Mono',monospace; font-size: 12px;}
    .empty .big{
        font-family: 'Barlow Condensed',sans-serif;
        font-size: 26px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #e9e4d6;
        margin-bottom: 8px;
    }
    .dispatch{
        background: #e9e4d6;
        color: #22201a;
        border-radius: 4px;
        margin-bottom: 22px;
        overflow: hidden;
        box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }

    .dispatch.adhoc{ box-shadow: 0 8px 22px rgba(76,122,91,0.28);}
    .dispatch-head{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: #dcd5c2;
        border-bottom: 1px solid #c7bfa8;
        flex-wrap: wrap;
        gap: 8px;
    }
    .dispatch.adhoc .dispatch-head{ background: #d7ddce;}
    
    .dispatch-no{
        font-family: 'Barlow Condensed',sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-size: 19px;
    }
    .dispatch-no span {color: #8a6425;}
    .dispatch.adhoc .dispatch-no span {color: #4c7a5b;}
    
    .src-badge{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b6455;
        margin-left: 8px;
    }
    .ticker{
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        font-family: 'IBM Plex Mono',monospace;
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }
    .tick{
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 7px;
        border-radius: 10px;
        background: #c7bfa8;
        color:#6b6455;
    }
    .tick.filled{background: #4c7a5b;color: #eafff0;}
    .tick.active{background: #e8a33d; color: #2a1c04;}
    .tick-dot{width: 5px; height: 5px; border-radius: 50%; background: currentColor;}
    .tick.error{background: #b5442e; color:#ffe9e4;}
            
    .dispatch-body{
        display: flex;
        gap: 18px;
        padding: 16px 18px;
        flex-wrap: wrap;
    }
    .preview{
        width: 220px;
        max-width: 100%;
        flex-shrink: 0;
    }
    .preview video, .preview iframe{
        width: 220px;
        max-width: 100%;
        aspect-ratio: 16/9;
        border-radius: 3px;
        background: #000;
        border: none;
        display: block;
    }
    .report{
        flex: 1;
        min-width: 220px;
        font-family: 'IBM Plex Mono',monospace;
        font-size: 12.5px;
        line-height: 1.6;
        color: #3a362c;
        background: #f3efe4;
        border: 1px dashed #b9b09a;
        padding: 10px 12px;
        border-radius: 2px;
    }
    .report .label{
        display: block;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #8a6425;
        margin-bottom: 5px;
    }
    .report.pending{color: #9c9585; font-style: italic;}
    
    .err-block{
        color: #b5442e;
        font-weight: 600;
    }
    .bylines{
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap: 12px;
        padding: 0 18px 18px;
    }
    .byline-card{
        position: relative;
        background: #f3efe4;
        border: 1px solid #cfc7b0;
        border-radius: 3px;
        padding: 14px 14px 16px;
        min-height: 120px;
    }
    .byline-name{
        font-family: 'Barlow Condensed',sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 15px;
        color: #22201a;
    }
    .byline-tag{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 9.5px;
        color: #8a8168;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom:8px;
        display: block;
    }
    .byline-caption{
        font-size: 13.5px;
        line-height: 1.45;
        color: #2c2a22;
        min-height: 36px;
    }
    .byline-caption.empty{color: #ac9c88;font-style: italic;}
    .card-footer{
        margin-top: 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .scores{
        font-family: 'IBM Plex Mono',monospace;
        font-size: 10.5px;
        color: #7a7360;
    }
    .copy-btn{
        font-family: 'IBM Plex Mono',monospace;;
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: none;
        border: 1px solid #b9b09a;
        color: #5c5747;
        border-radius: 2px;
        padding: 1px 7px;
        cursor: pointer;
    }
    .copy-btn:hover:not(:disabled){border-color: #8a6435; color: #8a6425;}
    .copy-btn:disabled{opacity: 0.35;cursor: not-allowed;}
    .stamp{
        position: absolute;
        top: 8px;
        right: 10px;
        font-family: 'IBM Plex Mono',monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        border: 1.5px solid currentColor;
        border-radius: 2px;
        padding: 2px 6px;
        transform: rotate(-6deg);
        text-transform: uppercase;
        opacity: 0.9;
    }
    .stamp.approved{color: #4c7a5b;}
    .stamp.revised{color:#b5442e}

    footer{
        text-align: center;
        padding: 20px;
        font-family: 'IBM Plex Mono',monospace;
        font-size: 10.5px;
        color: #565d69;
    }
    </style>
    </head>
    <body>
    
    <div class="masthead">
        <div>
            <h1>VID transcriber</h1>
                <div class="sub">multi model video caption generator paste any youtube url</div>
        </div>

    <div class="control-strip">
        <label for="apiBase">API</label>
        <input id="apiBase" class="api-field" value=""
